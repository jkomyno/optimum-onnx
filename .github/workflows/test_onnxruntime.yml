name: ONNX Runtime / Python - Test

on:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: true
  UV_TORCH_BACKEND: auto
  TRANSFORMERS_IS_CI: true
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      # Every job pulls hundreds of models from the Hub. Running all 16 at once exhausts the
      # account-wide Hub API quota (1000 requests / 5 minutes) and the suites then fail with 429s
      # that look like real test failures.
      max-parallel: 4
      matrix:
        python-version: [3.11]
        runs-on: [ubuntu-24.04]
        # 5.14.* is the declared floor, latest is the early warning for intra-5.x churn.
        transformers_version: [latest, 5.14.*]
        test_file:
          [
            test_decoder.py,
            test_diffusion.py,
            test_modeling.py,
            test_optimization.py,
            test_quantization.py,
            test_seq2seq.py,
            test_timm.py,
            test_utils.py,
          ]

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests,onnxruntime]

      - name: Install diffusers
        run: |
          uv pip install diffusers

      - name: Install transformers ${{ matrix.transformers_version }}
        run: |
          if [ "${{ matrix.transformers_version }}" != 'latest' ]; then
            uv pip install "transformers==${{ matrix.transformers_version }}"
          fi

      - name: Test with pytest
        run: |
          pytest tests/onnxruntime/${{ matrix.test_file }} -vvvv -n auto
